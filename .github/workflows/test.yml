name: Tests

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs (e.g. Graphite) target other feature
  # branches and would otherwise get no CI at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads `packageManager` from package.json, so this workflow always runs
      # the pnpm that wrote the lockfile and `--frozen-lockfile` stays valid.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a high or critical advisory that is not listed under `audit.ignore`
      # in pnpm-workspace.yaml, so a newly published advisory cannot sit unnoticed
      # until the next manual dependency refresh.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm type-check

      # `pnpm lint` runs ESLint with --fix; CI must not rewrite the checkout.
      - name: Lint
        run: pnpm exec eslint .

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run tests
        run: pnpm vitest run

      # The PWA service worker is generated by workbox-build, which is also the
      # only path that pulls the overridden glob/minimatch versions, so a broken
      # build would otherwise only surface at release time.
      - name: Build
        run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
