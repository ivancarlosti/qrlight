<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies the stored reading direction before the first paint, so an RTL
      // language (Arabic) never flashes a left-to-right layout. Keep the RTL
      // list in sync with src/utils/i18n.ts, which sets lang/dir again on mount.
      ;(() => {
        try {
          const stored = localStorage.getItem('preferred-language') || navigator.language || 'en'
          const rtl = ['ar', 'fa', 'he', 'ur'].includes(stored.split('-')[0].toLowerCase())
          document.documentElement.dir = rtl ? 'rtl' : 'ltr'
        } catch {
          /* storage can be blocked; the app still applies the language on mount */
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      name="description"
      content="QRLight is a lightweight QR code generator and scanner. Design QR codes, print them with their frame, and scan codes instantly."
    />
    <meta
      name="keywords"
      content="QR code, easy generator, simple scanner, print QR code, custom, design, QR code creator, QR code maker"
    />
    <meta name="author" content="Ivan Carlos" />
    <meta property="og:title" content="QRLight" />
    <meta
      property="og:description"
      content="QRLight is a lightweight QR code generator and scanner. Design QR codes, print them with their frame, and scan codes instantly."
    />
    <meta property="og:url" content="https://github.com/ivancarlosti/qrlight" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QRLight" />
    <meta
      name="twitter:description"
      content="QRLight is a lightweight QR code generator and scanner. Design QR codes, print them with their frame, and scan codes instantly."
    />
    <meta name="license" content="GNU General Public License v3.0" />
    <meta name="color-scheme" content="dark light" />

    <title>QRLight</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
